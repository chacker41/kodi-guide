name: guide
on:
  schedule:
    - cron: "17 9 * * *"   # every day, about 4 am in Indiana
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_guide.py
        env:
          GUIDE_URL: https://raw.githubusercontent.com/${{ github.repository }}/output/guide.xml.gz
      - name: Publish to the output branch (replaced each day, so the repository stays small)
        run: |
          cd out
          git init -q -b output
          git add -A
          git -c user.name="guide bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Guide $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
